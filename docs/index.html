<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farol de Sal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
/* Layout: coluna única tipo telemóvel sobre uma carta náutica antiga; estado no topo, ecrã ativo ao meio, separadores em baixo. Um só mundo visual: pergaminho e tinta. */
:root{
  color-scheme:light;
  --perg:#e6d5ac; --perg2:#dcc894; --perg3:#cdb67d; --mesa:#3b2c1c;
  --tinta:#2e2012; --sepia:#6b5230; --mar:#3f6f73; --lacre:#9c2f22; --lacre2:#6d1d14; --ouro:#a8791c; --musgo:#4f6b34;
  --r0:#5c4a30; --r1:#3f6a2c; --r2:#2a5d85; --r3:#7a2f86; --r4:#9a5b08; --r5:#a3262e; --r6:#0d6a6a;
  --f-tit:'IM Fell English SC','Palatino Linotype',Georgia,serif;
  --f-it:'IM Fell English',Georgia,serif;
  --f-txt:'Alegreya Sans','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box}
body{margin:0}[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--mesa);color:var(--tinta);font:16px/1.4 var(--f-txt);display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;position:relative;
  background:radial-gradient(ellipse at 50% 30%,var(--perg) 40%,var(--perg2) 85%,var(--perg3) 100%);border-inline:1px solid var(--tinta)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--lacre);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.arte{fill:none;stroke:var(--tinta);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.arte .agua{stroke:var(--mar)}

header{padding:10px 16px 12px;border-bottom:3px double var(--tinta);display:flex;flex-direction:column;gap:8px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:6px}
.topo h1{font:400 26px/1 var(--f-tit);margin:0;letter-spacing:.03em}
.moedas{display:flex;gap:12px;font-size:14px;color:var(--sepia)}
.moedas b{color:var(--tinta)}
.barras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.barra{min-width:0}
.barra small{display:flex;justify-content:space-between;font-size:12px;color:var(--sepia);gap:4px;white-space:nowrap}
.barra small span:first-child{font-family:var(--f-tit);letter-spacing:.05em}
.trilho{height:9px;border:1px solid var(--tinta);margin-top:2px;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--perg3) 9px 10px)}
.trilho i{display:block;height:100%;width:0;transition:width .3s}
.hp i{background:var(--lacre)} .en i{background:var(--ouro)} .xp i{background:var(--musgo)}

main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
h2{font:400 22px/1.1 var(--f-tit);margin:0;letter-spacing:.03em;text-wrap:balance}
h3.sub{font:400 17px var(--f-tit);margin:6px 0 0;letter-spacing:.03em;color:var(--sepia)}
p{margin:0}
.nota{color:var(--sepia);font-size:14px}
.lenda{font:italic 15px/1.35 var(--f-it);color:var(--sepia)}
.lista{display:flex;flex-direction:column;gap:10px}
.cartao{border:3px double var(--tinta);padding:10px 12px;display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--perg) 70%,transparent)}
.cartao>div{min-width:0;display:flex;flex-direction:column;gap:2px;flex:1}
.cartao h3{font:400 18px/1.2 var(--f-tit);margin:0;letter-spacing:.02em}
.cartao.trancado{opacity:.5}
.btn{background:var(--lacre);color:var(--perg);border:1px solid var(--lacre2);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--perg) 25%,transparent),0 2px 0 var(--lacre2)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--perg) 25%,transparent)}
.btn[disabled]{background:transparent;color:var(--sepia);border:1px dashed var(--sepia);box-shadow:none;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--tinta);box-shadow:none;font-weight:400}
.btn.peq{padding:4px 10px;font-size:14px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex-direction:row!important;flex:none!important;max-width:55%}
.solta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.treino{grid-template-columns:1fr}.attr{flex-wrap:wrap}
.forja{grid-column:1/-1;border:1px dashed var(--tinta);padding:8px 10px;display:flex;flex-direction:column;gap:6px}.forja .btn{white-space:normal;text-align:left;border-radius:14px}
select{font:inherit;background:transparent;color:var(--tinta);border:1px solid var(--tinta);padding:4px 6px}
.r4{color:var(--r4)}.r5{color:var(--r5)}.r6{color:var(--r6)}.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.equip{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.attr b{font-weight:700}
.attr{border:1px solid var(--tinta);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.attr span small{display:block;color:var(--sepia);font-size:13px}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--sepia)}
.stats b{color:var(--tinta)}
.r0{color:var(--r0)}.r1{color:var(--r1)}.r2{color:var(--r2)}.r3{color:var(--r3)}
.selo{font:400 12px var(--f-tit);letter-spacing:.06em;border:1px solid currentColor;padding:0 5px;border-radius:999px;color:var(--mar);vertical-align:middle}
.selo.sim{color:var(--sepia)}
input[type=text]{background:transparent;border:0;border-bottom:1px solid var(--tinta);color:var(--tinta);font:italic 17px var(--f-it);padding:4px 2px;width:100%;max-width:200px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px dotted var(--sepia)}
th{color:var(--sepia);font:400 13px var(--f-tit);letter-spacing:.06em}
td:last-child,th:last-child{text-align:right}
tr.eu td{color:var(--lacre);font-weight:700}

nav{display:grid;grid-template-columns:repeat(6,1fr);border-top:3px double var(--tinta)}
nav button{background:none;border:0;padding:12px 2px;font:400 14px var(--f-tit);letter-spacing:.03em;color:var(--sepia)}
nav button[aria-current=true]{color:var(--lacre);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}

#luta{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,var(--perg) 40%,var(--perg2) 85%,var(--perg3) 100%);display:flex;flex-direction:column;padding:16px;gap:10px;z-index:5}
.duelo{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.duelo div{min-width:0}
.duelo strong{font:400 18px/1.2 var(--f-tit);display:block}
.duelo .dir{text-align:right}
#lArte{align-self:center}
#reg{flex:1;overflow-y:auto;border:3px double var(--tinta);padding:10px;font-size:15px;display:flex;flex-direction:column;gap:4px;min-height:0}
#reg .t{color:var(--musgo)} #reg .e{color:var(--lacre)} #reg .f{font:400 18px var(--f-tit);margin-top:6px}
#reg .p{color:var(--r3);font-style:italic}
@media (prefers-reduced-motion:reduce){.trilho i{transition:none}}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="topo">
      <div class="marca"><svg class="arte" viewBox="0 0 64 48" width="44" aria-hidden="true"><path d="M26 44l3-26h6l3 26zM27 18h10v-6H27zM30 12l2-6 2 6M20 44h24M28 28h8M27 36h10M38 13l13-4M38 16l13 4M26 13L13 9M26 16l-13 4"/></svg><h1>Farol de Sal</h1></div>
      <div class="moedas"><span>Sal <b class="num" id="hSal">0</b></span><span>Sucata <b class="num" id="hSuc">0</b></span><span>Nv <b class="num" id="hNv">1</b></span></div>
    </div>
    <div class="barras">
      <div class="barra en"><small><span>Energia</span><span class="num" id="hEn"></span></small><div class="trilho"><i id="bEn"></i></div></div>
      <div class="barra xp"><small><span>XP</span><span class="num" id="hXp"></span></small><div class="trilho"><i id="bXp"></i></div></div>
    </div>
  </header>
  <main id="ecra"></main>
  <nav id="nav">
    <button data-tab="explorar">Carta</button>
    <button data-tab="heroi">Herói</button>
    <button data-tab="loja">Loja</button>
    <button data-tab="farol">Farol</button>
    <button data-tab="arena">Arena</button>
    <button data-tab="opcoes">Opções</button>
  </nav>
  <section id="luta" hidden>
    <div class="duelo">
      <div><strong id="lN1"></strong><div class="barra hp"><div class="trilho"><i id="lB1"></i></div></div></div>
      <span class="lenda">contra</span>
      <div class="dir"><strong id="lN2"></strong><div class="barra hp"><div class="trilho"><i id="lB2"></i></div></div></div>
    </div>
    <div id="lArte"></div>
    <div id="reg" aria-live="polite"></div>
    <button class="btn" id="lFim">Saltar</button>
  </section>
</div>

const RAR_P=[0,28,12,5,2,.8,.3], NBON=[1,1,1,1,2,2,3], BM=[1,1.5,2.2,3,4,5.2,7], JM=[1,1.3,1.7,2.2,2.8,3.5,4.5];

  for(let r=0;r<80&&a.hp>0&&b.hp>0;r++){

    for(let g=0;g<golpes&&a.hp>0&&b.hp>0;g++){

  ZONAS.map((Z,i)=>{const tr=i>S.zc,fr=i===S.zc,w=S.zw||0,pronto=fr&&w>=bossN(i);return `<div class="cartao${tr?' trancado':''}">${arte(Z.a,56)}<div><h3>${Z.n}</h3><p class="lenda">${Z.d}</p><p class="nota num">Inimigos nv ${Z.base}–${Z.base+2} · força ×${String(Z.f).replace('.',',')} </p>${fr?`<p class="nota num">${pronto?'O chefe espera: '+Z.boss:'Chefe: '+Z.boss+' · '+w+'/'+bossN(i)+' vitórias'}</p>`:i<S.zc?`<p class="nota">Chefe vencido</p>`:''}</div>
  <div class="acoes"><button class="btn" data-act="exp" data-i="${i}" ${tr||S.exp||S.en<EN_ZONA?'disabled':''}>${tr?'Trancada':'Explorar'}</button>${tr?'':`<button class="btn sec peq" data-act="auto" data-i="${i}">${auto===i?'Parar':'Auto'}</button><button class="btn sec peq" data-act="expn" data-i="${i}:200" ${S.exp||S.en<EN_ZONA?'disabled':''}>Tudo</button>`}${pronto?`<button class="btn" data-act="boss" ${S.exp||S.en<EN_ZONA?'disabled':''}>Chefe</button>`:''}</div></div>`}).join('')+
  (!proxProva()?'':(P=>`<div class="cartao${S.nv<P.nv?' trancado':''}">${arte(S.classe,56)}<div><h3>${P.n}</h3><p class="lenda">Vence o ${P.boss} e tornas-te ${CLASSES[S.classe][P.t]}.</p><p class="nota">${CLASSES[S.classe][P.u]}</p><p class="nota num">Inimigo nv ${P.L} · ${P.en} energia</p></div>
  <button class="btn" data-act="prova" ${S.exp||S.nv<P.nv||S.en<P.en?'disabled':''}>${S.nv<P.nv?'Nível '+P.nv:'Enfrentar'}</button></div>`)(proxProva()))+
  `</div><p class="nota">Saídas ganhas: <span class="num">${S.vit}</span>. Uma em cada dez traz um Alfa: mais forte, larga sempre um objeto.</p>`;
}
function vHeroi(){
  return `<h2>${esc(S.nome)}, nível ${S.nv}</h2><p class="lenda">${titulo()}. ${poder()}</p>
  <h2>Atributos totais</h2><div class="stats"><span>Dano ${tipo()==='m'?'mágico':'físico'} <b class="num">${atk()}</b></span><span>Armadura física <b class="num">${armF()}</b></span><span>Armadura mágica <b class="num">${armM()}</b></span><span>Vida <b class="num">${maxHp()}</b></span><span>Esquiva <b class="num">${esq()}%</b></span><span>Crítico (dano ×2) <b class="num">${crit()}%</b></span><span>Ataque duplo <b class="num">${duplo()}%</b></span><span>Roubo de vida <b class="num">${roubo()}%</b></span><span>Refletir dano <b class="num">${refl()}%</b></span><span>XP extra <b class="num">${bXp()}%</b></span><span>Sal extra <b class="num">${bSal()}%</b></span></div><h2>Treino</h2>
  <p class="nota">Treina os atributos com sal. Cada ponto custa mais do que o anterior. Mantém um botão premido para continuar a subir até o largares ou o sal acabar.</p><div class="attrs treino">`+
  Object.keys(ATR).map(k=>`<div class="attr"><span>${ATR[k][0]} <b class="num">${S.attr[k]}${eqSoma(k)?' +'+eqSoma(k):''}</b><small>${ATR[k][1]}</small></span><div class="solta">${[1,10].map(n=>`<button class="btn peq" data-act="attr" data-i="${k}:${n}" aria-label="Subir ${ATR[k][0]} ${n} ${n>1?'pontos':'ponto'}" ${S.sal>=custoAtr(k)?'':'disabled'}>+${n} · <span class="num">${custoAtrN(k,n)}</span> sal</button>`).join('')}</div></div>`).join('')+`</div>
  <h2>Equipado</h2><div class="attrs equip">`+
  Object.keys(SLOT).map(s=>{const i=S.eq[s];return `<div class="attr"><span><small>${SLOT[s]}</small>${i?`<b class="r${i.r}">${nomeItem(i)}</b><small class="num">Nv ${i.nv} · ${descItem(i)}${descBonus(i)}</small>`:'Vazio'}</span>${i?`<button class="btn sec peq" data-act="tirar" data-i="${s}">Tirar</button><button class="btn sec peq" data-act="forja" data-i="${i.id}">Forja</button>`:''}</div>${i?forja(i):''}`}).join('')+
  `</div><h2>Mochila <span class="num nota">${S.inv.length}/20</span></h2>`+vLimpa()+`<div class="lista">`+
  (S.inv.length?S.inv.map(i=>`<div class="cartao"><div><h3 class="r${i.r}">${nomeItem(i)}</h3><p class="nota num">${SLOT[i.slot]} · ${RAR[i.r]} · Nv ${i.nv}</p><p class="nota num">${descItem(i)}${descBonus(i)}</p></div>
  <div class="acoes"><button class="btn peq" data-act="equipar" data-i="${i.id}">Equipar</button><button class="btn sec peq" data-act="vender" data-i="${i.id}">Vender ${i.val}</button><button class="btn sec peq" data-act="desmontar" data-i="${i.id}">Desmontar</button><button class="btn sec peq" data-act="forja" data-i="${i.id}">Forja</button></div></div>${forja(i)}`).join(''):'<p class="lenda">Vazia. Os inimigos largam objetos de vez em quando.</p>')+
  `</div>`;
}
const CODIGOS={
 SAL1000:['+1000 de sal',()=>{S.sal+=1000}],
 SUCATA500:['+500 de sucata',()=>{S.suc+=500}],
 ENERGIA:['Energia cheia',()=>{S.en=maxEn()}],
 BILHETES:['Bilhetes da arena cheios',()=>{S.bil=5}],
 NIVEL5:['+5 níveis',()=>{S.nv=Math.min(NV_MAX,S.nv+5);S.xp=0}],
 OBRAFEITA:['A obra, a expedição e a incubação terminam já',()=>{if(S.obra)S.obra.fim=0;if(S.exp)S.exp.fim=0;if(S.choco)S.choco.fim=0}],
 EPICO:['Um objeto épico do teu nível',()=>{if(S.inv.length<20)S.inv.push(gerarItem(S.nv,3))}]
};
function vOpcoes(){
  return `<h2>Opções</h2><h3 class="sub">Nome do faroleiro</h3><div class="solta"><input type="text" id="nome" maxlength="16" value="${esc(S.nome)}" aria-label="Nome do faroleiro"><button class="btn sec peq" data-act="nome">Mudar</button></div>
  <h3 class="sub">Código de bónus</h3><div class="solta"><input type="text" id="codigo" maxlength="20" autocomplete="off" autocapitalize="characters" aria-label="Código de bónus" placeholder="Escreve o código"><button class="btn peq" data-act="codigo">Usar</button></div>
  <p class="nota">Códigos de teste, que se podem repetir:</p><table>`+Object.keys(CODIGOS).map(k=>`<tr><td class="num">${k}</td><td>${CODIGOS[k][0]}</td></tr>`).join('')+`</table>
  <h3 class="sub">Progresso</h3><p class="nota">${nuvem==='ligado'?'Guardado na tua conta: continua noutro dispositivo.':nuvem==='erro'?'Não foi possível guardar na conta. O progresso continua neste dispositivo.':'Guardado só neste dispositivo.'}</p>
  <div class="solta"><button class="btn sec peq" data-act="reset">${confirmar?'Confirmar: apagar tudo':'Recomeçar do zero'}</button></div>`;
}
function vFarol(){
  return `<h2>O teu farol</h2><p class="lenda">Melhora as construções com sal e sucata. Nenhuma pode passar do nível do Farol, e só há mãos para uma obra de cada vez.</p><div class="lista">`+
  Object.keys(EDIF).map(k=>{const n=S.ed[k],E=EDIF[k],c=custoEd(k),max=n>=10,aqui=S.obra&&S.obra.k===k,preso=!max&&!podeSubir(k),pode=!max&&!preso&&!S.obra&&S.sal>=c.sal&&S.suc>=c.suc;
  return `<div class="cartao">${arte(k,48)}<div><h3>${E.n} <span class="num nota">nv ${n}${aqui?' → '+(n+1):''}</span></h3><p class="nota">${E.d(n)}</p><p class="lenda">${E.p}</p>${max||aqui?'':`<p class="nota num">Obra: ${fmtT(tempoObra(k))}</p>`}</div>
  <button class="btn" data-act="obra" data-i="${k}" ${pode?'':'disabled'}>${max?'Máximo':aqui?`Em obra<br><span class="num">${fmtT(S.obra.fim-Date.now())}</span>`:preso?(k==='incubadora'&&S.nv<(n+1)*10?'Nível '+(n+1)*10:'Sobe o Farol'):`<span class="num">${c.sal}</span> sal<br><span class="num">${c.suc}</span> sucata`}</button></div>`}).join('')+`</div>`+vPets();
}
function vArena(){
  const sims=SIMULADOS.map((r,i)=>({k:'s:'+i,n:r[0],p:r[1],nv:Math.max(1,Math.round(r[1]/45))}));
  const perto=l=>l.slice().sort((a,b)=>Math.abs(a.p-S.pontos)-Math.abs(b.p-S.pontos));
  const alvos=perto(reais.map(r=>Object.assign({k:'r:'+r.id},r))).slice(0,4).concat(perto(sims).slice(0,reais.length?2:3)).sort((a,b)=>a.p-b.p);
  const todos=reais.concat(sims,[{n:S.nome,p:S.pontos,eu:1}]).sort((a,b)=>b.p-a.p);
  const esp=S.bil<5?` · próximo em ${Math.ceil((BIL_MS-(Date.now()-S.tB))/60000)} min`:'';
  const estado=nuvem==='ligado'?(reais.length?`Há ${reais.length} ${reais.length>1?'amigos':'amigo'} na arena.`:'Ainda nenhum amigo abriu o jogo. Partilha a página com eles e aparecem aqui.'):'Sem ligação à conta: só há rivais simulados.';
  return `<h2>Arena dos Fantasmas</h2><p class="lenda">Lutas contra a cópia do faroleiro de um amigo, por isso ele não precisa de estar ligado.</p>
  <p class="nota">${estado}</p><p class="nota">Bilhetes: <b class="num">${S.bil}/5</b>${esp}</p><div class="lista">`+
  alvos.map(a=>`<div class="cartao">${arte('serpente',44)}<div><h3>${esc(a.n)} <span class="selo${a.real?'':' sim'}">${a.real?'amigo':'simulado'}</span></h3><p class="nota num">${a.p} pontos · nv ${a.nv}</p></div><button class="btn" data-act="arena" data-i="${esc(a.k)}" ${S.bil&&!S.exp?'':'disabled'}>Desafiar</button></div>`).join('')+
  `</div><h2>Classificação</h2><table><tr><th>#</th><th>Faroleiro</th><th>Pontos</th></tr>`+
  todos.map((t,i)=>`<tr${t.eu?' class="eu"':''}><td class="num">${i+1}</td><td>${esc(t.n)}${t.eu?' (tu)':t.real?' <span class="selo">amigo</span>':''}</td><td class="num">${t.p}</td></tr>`).join('')+`</table>`;
}
function desenhar(){
  recuperar();topo();
  document.getElementById('ecra').innerHTML=(aviso?`<p class="nota" style="color:var(--lacre)">${aviso}</p>`:'')+(S.classe?{explorar:vExplorar,heroi:vHeroi,loja:vLoja,farol:vFarol,arena:vArena,opcoes:vOpcoes}[tab]:vClasse)();
  aviso='';
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab));
}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;confirmar=false;desenhar();document.getElementById('ecra').scrollTop=0};
document.getElementById('ecra').onclick=e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,i=b.dataset.i;
  if(ignorar)return;
  if(a!=='reset')confirmar=false;
  if(a==='exp')return explorar(+i);
  if(a==='prova')return prova();
  if(a==='expn'){recuperar();const [z,n]=String(i).split(':'),r=variasSaidas(Number(z),n);if(r){guardar();mostrarLuta(...r)}return}
  if(a==='boss'){recuperar();const r=boss();if(r){guardar();mostrarLuta(...r)}return}
  if(a==='auto'){auto=auto===+i?null:+i;autoMsg='';autoEspera=0;return desenhar()}
  if(a==='forja'){aberto=aberto==i?null:i;return desenhar()}
  if(a==='hmais'||a==='hmenos'){horas=Math.min(10,Math.max(1,horas+(a==='hmais'?1:-1)));return desenhar()}
  if(a==='partir'){recuperar();aviso=partir(i)}
  if(a==='voltar'){recuperar();aviso=voltar()}
  if(a==='classe'&&CLASSES[i]&&!S.classe){S.classe=i;S.hp=maxHp();aviso=`És agora ${CLASSES[i].n}.`}
  if(a==='comprar'){const k=S.loja.it.findIndex(x=>x.id==i),it=S.loja.it[k];if(it&&S.sal>=it.preco&&S.inv.length<20){S.sal-=it.preco;S.loja.it.splice(k,1);delete it.preco;S.inv.push(it);aviso=`Compraste ${it.nome}.`}}
  if(a==='renovar'&&S.sal>=custoRenovar()){S.sal-=custoRenovar();stock(true)}
  if(a==='arena')return arena(i);
  if(a==='chocar'){recuperar();aviso=chocar(i)}
  if(a==='pet')aviso=levarPet(i);
  if(a==='limpar')aviso=limparMochila(i);
  if(a==='lixo')aviso=regraLixo(i);
  if(a==='attr')treinar(i);
  if(a==='melhorar')aviso=melhorar(i);
  if(a==='trocar')aviso=trocarBonus(i);
  if(a==='equipar'){const k=S.inv.findIndex(x=>x.id==i);if(k>=0){const it=S.inv.splice(k,1)[0];if(S.eq[it.slot])S.inv.push(S.eq[it.slot]);S.eq[it.slot]=it}}
  if(a==='tirar'&&S.eq[i]){if(S.inv.length<20){S.inv.push(S.eq[i]);S.eq[i]=null}else aviso='A mochila está cheia. Vende ou desmonta um objeto primeiro.'}
  if(a==='vender'||a==='desmontar'){const k=S.inv.findIndex(x=>x.id==i);if(k>=0){const it=S.inv.splice(k,1)[0];if(a==='vender'){S.sal+=it.val;aviso=`Vendido por ${it.val} sal.`}else{const s=Math.ceil((1+it.nv/2)*MULT[it.r]);S.suc+=s;aviso=`Desmontado: +${s} sucata.`}}}
  if(a==='obra'&&EDIF[i]){recuperar();const c=custoEd(i);if(!S.obra&&S.sal>=c.sal&&S.suc>=c.suc&&podeSubir(i)){S.sal-=c.sal;S.suc-=c.suc;S.obra={k:i,fim:Date.now()+tempoObra(i)};aviso=`Obra iniciada: ${EDIF[i].n}.`}}
  if(a==='nome'){const v=document.getElementById('nome').value.trim();if(v)S.nome=v.slice(0,16)}
  if(a==='codigo'){const c=document.getElementById('codigo').value.trim().toUpperCase();if(Object.hasOwn(CODIGOS,c)){CODIGOS[c][1]();recuperar();aviso=`Código aceite: ${CODIGOS[c][0]}.`}else aviso='Esse código não existe.'}
  if(a==='reset'){if(confirmar){S=novo();S.hp=maxHp();confirmar=false;tab='explorar'}else{confirmar=true;desenhar();return}}
  guardar();desenhar();
};

document.getElementById('ecra').addEventListener('change',e=>{if(e.target.id==='rarAte'){rarSel=+e.target.value;desenhar()}});
/* Manter premido: repete o treino até largar ou acabar o sal. */
let seg=null, ignorar=false;
function largar(){if(seg){clearTimeout(seg.t);clearInterval(seg.r);seg=null}}
document.getElementById('ecra').addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-act="attr"]'); if(!b||b.disabled)return; largar();
  const i=b.dataset.i, s=seg={n:0};
  s.t=setTimeout(()=>{s.r=setInterval(()=>{if(seg!==s)return;if(!treinar(i))return largar();s.n++;guardar();desenhar()},110)},400);
});
for(const ev of ['pointerup','pointercancel'])document.addEventListener(ev,()=>{if(seg&&seg.n){ignorar=true;setTimeout(()=>ignorar=false,60)}largar()});
window.addEventListener('blur',largar);
document.getElementById('ecra').addEventListener('contextmenu',e=>{if(seg)e.preventDefault()});

function arrancar(d){
  S=(d&&d.S&&normalizar(d.S))||carregar()||novo(); if(S.hp>maxHp())S.hp=maxHp();
  desenhar();
  setInterval(()=>{const antes=S.en,obra=!!(S.obra||S.choco),ex=!!S.exp;recuperar();topo();if(auto!=null&&document.getElementById('luta').hidden&&!S.exp&&S.en>=EN_ZONA){const r=variasSaidas(auto,200);if(r){autoMsg=resumo(r[2]);guardar();topo();if(tab==='explorar')desenhar()}else auto=null}if(document.getElementById('luta').hidden&&(S.en!==antes&&tab==='explorar'||obra&&(tab==='farol'||!(S.obra||S.choco))||ex&&(tab==='explorar'||!S.exp)))desenhar()},1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)local()});
  ligar().catch(()=>{});
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(arrancar):arrancar(window.claude?.hot?.data??{});
</script>

</body>
